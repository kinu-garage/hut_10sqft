# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false  # Allows other jobs in the matrix to continue if one fails
      matrix:
        os: [ubuntu-24.04, macos-14]
#        os: [debian-11, ubuntu-24.04, macos-11]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Set up Python path
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/hut_10sqft/src" >> $GITHUB_ENV  
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install colcon-common-extensions flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Build with colcon
      run: |
        colcon build --symlink-install
    - name: Test with colcon
      run: |
        source install/setup.bash
        colcon test --event-handlers console_direct+; colcon test-result --all --verbose
