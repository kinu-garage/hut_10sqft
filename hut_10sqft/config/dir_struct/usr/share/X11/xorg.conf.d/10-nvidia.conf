Section "OutputClass"
    Identifier "nvidia"
    MatchDriver "nvidia-drm"
    Driver "nvidia"
    # Next 1 line is added to enable eGPU. See https://github.com/kinu-garage/hut_10sqft/issues/1120
    Option "AllowExternalGpus" "True"
    Option "AllowEmptyInitialConfiguration"
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
EndSection

