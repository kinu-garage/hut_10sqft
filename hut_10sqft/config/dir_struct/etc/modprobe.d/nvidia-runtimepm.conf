# Disable runtime D3 dynamic power management for NVIDIA eGPU to avoid
# PCIe link hang/deadlock during shutdown or link changes (nvidia-modeset wait timeout).
# Overrides /lib/modprobe.d/nvidia-runtimepm.conf generated by gpu-manager.
# See https://github.com/kinu-garage/hut_10sqft/issues/1317
options nvidia "NVreg_DynamicPowerManagement=0x00"
