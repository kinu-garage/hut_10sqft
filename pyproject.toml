[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hut_10sqft"
version = "0.6.0"
description = "Computer environment setup and tools for personal computing environments"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Isaac Saito", email = "iisaac.saito@gmail.com"}
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
suco = "hut_10sqft.suco_main:main"
suco_installer = "hut_10sqft.suco_installer:main"

[tool.setuptools]
packages = ["hut_10sqft", "hut_10sqft_lib"]

[tool.setuptools.package-dir]
hut_10sqft = "hut_10sqft/hut_10sqft"
hut_10sqft_lib = "hut_10sqft_lib/hut_10sqft_lib"
